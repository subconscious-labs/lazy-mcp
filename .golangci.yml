# golangci-lint config. Kept minimal: only linters we actively want,
# so results do not drift with golangci-lint version defaults.
run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - errorlint
    - gofmt
    - goimports
    - govet
    - ineffassign
    - misspell
    - nolintlint
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused

linters-settings:
  errcheck:
    # Ignore common fire-and-forget writers/closers.
    exclude-functions:
      - (io.Closer).Close
      - (*os.File).Close
      - fmt.Fprintf
      - fmt.Fprintln
      - (io.Writer).Write

  revive:
    rules:
      # Contexts first, no shadowing builtins — the two rules we hit.
      - name: context-as-argument
      - name: redefines-builtin-id
      - name: increment-decrement
      # Keep the rest of the default revive set.
      - name: blank-imports
      - name: context-keys-type
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: if-return
      - name: indent-error-flow
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: unreachable-code
      - name: unused-parameter
      - name: var-declaration
      - name: var-naming

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - unparam
        - unused
