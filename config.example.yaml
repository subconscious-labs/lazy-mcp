version: 1

# Includes
# --------
# include:
#   - "conf.d/*.yaml"
# - Paths relative to this file; globs supported.
# - proxy and auth may appear ONLY in this top-level file.
# - servers merge by name; last definition wins.
# - Nested include is not allowed.

# Substitutions
# -------------
# ${NAME}, ${NAME:-default}, ${NAME:?msg}, ${file:/path}, $$ for literal $.
# Works inside included files.

auth:
  enabled: false
  users: []
  # users:
  #   - name: elsa
  #     token_sha256: "<64 hex chars>"  # printf %s "$TOKEN" | sha256sum
  #     role: agent
  #     # Required for role: agent. An empty list is a load error,
  #     # so an agent with no servers cannot be configured by mistake.
  #     allowed_servers: [git, tasks]

proxy:
  # Which frontend(s) to run: "stdio", "http", "both".
  # Empty auto-picks: http if http.addr is set, stdio otherwise.
  transport: "stdio"
  http:
    addr: ""                      # e.g. ":3333"
    session_ttl: 30m
    allowed_origins:
      - "http://localhost:*"
      - "http://127.0.0.1:*"

  tool_prefix: "meta"
  max_search_results: 8
  warmup: false
  # Set to -1 to disable (never stop idle backends).
  idle_ttl: 10m
  # How long to cache tools/list from a backend.
  tool_cache_ttl: 30m
  # Per tools/call timeout.
  exec_timeout: 60s
  # MCP handshake timeout when starting a backend.
  initialize_timeout: 10s

  # Hard cap on paginated result size.
  # Set to -1 to disable (accept any result size, not recommended).
  max_result_bytes: 262144
  # Cap on serialized arguments payload.
  max_arguments_bytes: 262144
  # Cap on summary returned by meta_search (full desc in describe_tool).
  max_summary_len: 200
  # Reject a single raw result larger than this before buffering.
  # Set to -1 to disable (accept any result size, not recommended).
  max_raw_result_bytes: 10485760

  # Default page size for meta_call. 0 = auto-paginate only if > max_result_bytes.
  default_page_size: 0
  # How long paged cursors survive in memory.
  cursor_ttl: 5m
  # Grace period for in-flight requests on SIGTERM.
  shutdown_timeout: 5s

  # Prometheus textfile metrics for node_exporter.
  metrics_file: ""
  metrics_interval: 15s

  # Safety gates
  deny_dangerous: false
  deny_destructive: false

  circuit_breaker:
    enabled: true
    failure_threshold: 5
    cooldown: 30s

  log_file: ""
  log_file_max_mb: 50
  log_file_max_backups: 7
  log_file_max_age_days: 30
  log_file_compress: false

servers:
  - name: mempalace
    transport: stdio
    command: /opt/mcp/venv/bin/python
    args: ["-m", "mempalace.mcpserver", "--config", "/etc/mcp/mempalace.yaml"]
    description: "Long-term memory: knowledge graph, semantic search, drawers"
    tags: ["memory", "search", "knowledge-graph"]
    env:
      MEMPALACEPALACEPATH: /var/lib/mempalace
    autostart: false
    enabled: true
    dangerous_tools: []
    allowed_tools: []
    denied_tools: []

  - name: mempalace-http
    transport: http
    url: "http://127.0.0.1:9999/mcp"
    headers:
      Authorization: "Bearer ${MEMPALACE_TOKEN:?set in env}"
    description: "Long-term memory over HTTP"
    tags: ["memory", "http"]
    autostart: false
    enabled: false
    allowed_tools: []
    denied_tools: []

# Reloading
# ---------
# systemctl reload lazy-mcp.service  OR  kill -HUP <pid>  OR  meta_reload
# Applied live: proxy.* tunables, servers, command/args/env/url changes.
# Requires restart: proxy.log_file, proxy.metrics_file, proxy.metrics_interval,
# proxy.cursor_ttl.
